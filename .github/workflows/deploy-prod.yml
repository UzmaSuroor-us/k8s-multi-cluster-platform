name: Deploy to Production

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: true
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "❌ Deployment cancelled - confirmation required"
            exit 1
          fi
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Configure kubeconfig for prod cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
          kubectl config use-context kind-prod-cluster
      
      - name: Backup current deployment
        run: |
          kubectl get deployment sample-app -n sample-app -o yaml > backup-deployment.yaml || true
      
      - name: Deploy to production
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            IMAGE_TAG=${{ github.event.release.tag_name }}
          else
            IMAGE_TAG=${{ github.event.inputs.image_tag }}
          fi
          
          helm upgrade --install sample-app helm/sample-app \
            --namespace sample-app --create-namespace \
            --set image.tag=$IMAGE_TAG \
            --set replicaCount=3 \
            --wait --timeout 10m
      
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/sample-app -n sample-app --timeout=10m
          kubectl get pods -n sample-app
      
      - name: Run smoke tests
        run: |
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -- \
            curl -s http://sample-app.sample-app.svc.cluster.local
      
      - name: Deployment summary
        run: |
          echo "✅ Deployed to PRODUCTION cluster"
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "Release: ${{ github.event.release.tag_name }}"
          else
            echo "Image tag: ${{ github.event.inputs.image_tag }}"
          fi
          echo "Replicas: $(kubectl get deployment sample-app -n sample-app -o jsonpath='{.status.readyReplicas}')"
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed - initiating rollback"
          kubectl rollout undo deployment/sample-app -n sample-app || true
