name: Multi-Cluster Deployment Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  HELM_VERSION: v3.12.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Lint Helm Charts
      run: |
        helm lint ./helm/sample-app
    
    - name: Validate Kubernetes Manifests
      run: |
        helm template ./helm/sample-app | kubectl apply --dry-run=client -f -

  deploy-dev:
    needs: test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > kubeconfig
        export KUBECONFIG=./kubeconfig
    
    - name: Deploy to Dev
      run: |
        ./scripts/deploy-app.sh dev ${{ github.sha }}
    
    - name: Run Smoke Tests
      run: |
        ./scripts/validate-cluster.sh dev

  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > kubeconfig
        export KUBECONFIG=./kubeconfig
    
    - name: Zero-Downtime Upgrade
      run: |
        ./scripts/upgrade-cluster.sh prod ${{ github.sha }}
    
    - name: Run Chaos Tests
      run: |
        ./scripts/chaos-test.sh prod
    
    - name: Notify on Failure
      if: failure()
      run: |
        ./scripts/rollback-cluster.sh prod backups/latest
