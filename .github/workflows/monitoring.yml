name: Deploy Monitoring Stack

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster to deploy monitoring'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          if [ "${{ github.event.inputs.cluster }}" == "dev" ]; then
            echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config
            kubectl config use-context kind-dev-cluster
          else
            echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
            kubectl config use-context kind-prod-cluster
          fi
      
      - name: Add Prometheus Helm repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
      
      - name: Deploy Prometheus Stack
        run: |
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            -f monitoring/prometheus-values.yaml \
            --wait --timeout 10m
      
      - name: Verify monitoring stack
        run: |
          kubectl get pods -n monitoring
          echo "✅ Monitoring stack deployed to ${{ github.event.inputs.cluster }}"
